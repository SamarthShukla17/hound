# MOSTLY FREE. mapper/hunter/poc run on free models (zai glm-4.7-flash, then the pinned
# cohere/north-mini-code:free).
# judge and scorer run on ONE paid model — openrouter z-ai/glm-5.3-flash (~$0.05/$0.17 per M
# tokens; OpenRouter credit, a few dollars covers many scans) — with free zai glm-4.7-flash as
# fallback. No random model router is used anywhere: every model is pinned by name, so runs
# with the same seed are replicates. A judge/scorer must be a fixed, capable model. The other paid
# targets (gpt-5.6-luna, grok-4.6) stay commented out below. Rate limits are the main
# constraint on the free roles: Z.ai free is ~1 req/sec with a daily cap and 429s under load;
# OpenRouter free is ~20 req/min with a low daily cap.
#
# Model IDs, free tiers, and prices change often — verify each one on its provider's
# page before relying on it. This file is a starting point, not a guarantee.
# Last checked 2026-09-16.

# hound is cloud-only. Local mode (Ollama) was removed after measuring 0.09 tok/s for a
# 14B-class model and 28 tok/s for 7B on a 16 GB M5 Air — Metal only exposes ~11.8 GiB there,
# and a 7B model is too weak to hunt or judge usefully anyway. --local-only now fails fast
# with that explanation instead of silently routing to a model that can't do the job.

providers:
  zai:
    base_url: https://api.z.ai/api/paas/v4
    key_env: ZAI_API_KEY
    rpm: 50
    concurrency: 1
    timeout: 120

  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    rpm: 18
    # 3, not 6: at 6 the provider returned climbing status=None transport errors and 429s
    # (15 backoffs in one scoring pass), which cost more wall-clock in retries than the extra
    # slots bought. 3 is the measured stable point. Concurrency is a rate knob only — it does
    # not change any result, so changing it mid-chain keeps runs comparable.
    concurrency: 3
    # 300s, not 120s: a whole-run scoring call (every candidate x every ground-truth bug) on a
    # mandatory-reasoning model exceeds 120s of generation. Hunter/judge calls run 15-150s, so
    # the only cost is that a genuinely stalled call takes longer to detect.
    timeout: 300

  openai:
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  xai:
    base_url: https://api.x.ai/v1
    key_env: XAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  anthropic:
    base_url: https://api.anthropic.com/v1/
    key_env: ANTHROPIC_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  x402gw:
    type: x402
    base_url: https://PLACEHOLDER.x402-gateway.example/v1  # TODO: real gateway base_url, testnet first
    key_env: null  # x402 pays with a wallet key (X402_SVM_KEY / X402_EVM_KEY), not a bearer token
    rpm: 30
    concurrency: 2
    timeout: 120

# Completion-token budget per role. Reasoning models (glm-4.7-flash, glm-5.3-flash) burn
# this on hidden thinking before emitting any content, so it is large; an empty reply with
# usage at the cap logs "TRUNCATED BY max_tokens" naming the role to raise. These are also
# the code defaults (llm.DEFAULT_MAX_TOKENS); a target may override with its own max_tokens.
max_tokens:
  mapper: 8000
  hunter: 20000
  judge: 24000
  judge2: 24000
  # 12000, not 24000: a real diagnosis answer measured 2088-9028 completion tokens, so this
  # is ample for the ANSWER while halving the time a reasoning-only burn wastes before it
  # gives up and falls through to the reasoning-off fallback.
  diagnose: 12000
  poc: 8000
  # 32000. Set from the MEASURED distribution of 270 successful scorer calls, not from a guess:
  # median 1264 completion tokens, p90 10359, p99 24847, max 36045. Mandatory reasoning makes
  # the tail enormous even though the answer itself is short.
  #   cap  8000 -> 14% of calls burn     cap 24000 -> 1.5%
  #   cap 16000 ->  4%                   cap 32000 -> 0.4%
  # An earlier 8000 here (guessed from "the answer is only a few hundred tokens") burned 14% of
  # calls; since ANY fallback use trips scorer_fallback_error, that aborted every scoring run.
  # 32000 keeps the burn rate near zero while still costing half of the old 60000 when one does
  # happen. Lower this only against fresh measurements.
  scorer: 32000

# Reasoning is switched off where the provider supports it, via `extra` (passed straight to
# the SDK call):
#   openrouter: extra_body.reasoning.enabled=false            (confirmed working)
#   zai:        extra_body.thinking.type=disabled             (confirmed working 2026-09-20: a one-word ping
#                                                              dropped from 166 completion tokens to 2)
roles:
  # PINNED to openrouter z-ai/glm-4.7-flash, SOLE target, no fallback, reasoning OFF (2026-09-21).
  # This is the only model measured to hunt productively (36 raw candidates in one seed); zai's
  # FREE endpoint for it was the problem (429 code 1305 storms), not the model. Paid on
  # OpenRouter at $0.061/$0.400 per M — cheaper than glm-5.3-flash and 200k context.
  # glm-5.3-flash was tried as hunter and starved: mandatory reasoning burned the whole 20k
  # completion budget on a 2117-line chunk, 20 of 70 lens-calls TRUNCATED, 6 raw candidates
  # across 5 seeds. Reasoning-off here leaks some thinking prose into content, which
  # extract_json strips (first "{" to last "}").
  # Earlier rejects: "openrouter/free" (random model per call, seeds not replicates),
  # cohere/north-mini-code:free (4/7/0 raw, one seed found nothing from 14 lenses).
  mapper:
    - {provider: openrouter, model: z-ai/glm-4.7-flash, extra: {extra_body: {reasoning: {enabled: false}}}}

  hunter:
    - {provider: openrouter, model: z-ai/glm-4.7-flash, extra: {extra_body: {reasoning: {enabled: false}}}}

  # Diagnosis reads ONE cited region cold. The claim that "the input is small and mandatory
  # reasoning has room" was WRONG and cost us: measured 2026-09-22, glm-5.3-flash burned all
  # 24000 completion tokens inside <think> on a 13.8k-char region and blew the 300s ceiling on
  # a 28.7k-char one. With a single target that silently returned {}, and 25 of 45 regions
  # across three runs were never diagnosed at all.
  # So: keep the strongest model first, but always leave somewhere to fall. glm-4.7-flash
  # takes reasoning-off, which is exactly what stops the burn.
  diagnose:
    - {provider: openrouter, model: z-ai/glm-5.3-flash}
    - {provider: openrouter, model: z-ai/glm-4.7-flash, extra: {extra_body: {reasoning: {enabled: false}}}}
    - {provider: zai, model: glm-4.7-flash, extra: {extra_body: {thinking: {type: disabled}}}}

  # Temperature is already 0 for judge calls (see agents.judge). PAID primary, free fallback.
  # z-ai/glm-5.3-flash has MANDATORY reasoning (a reasoning-off extra 400s: "Reasoning is
  # mandatory for this endpoint"), so no extra here — its thinking counts against max_tokens.
  judge:
    - {provider: openrouter, model: z-ai/glm-5.3-flash}
    - {provider: zai, model: glm-4.7-flash, extra: {extra_body: {thinking: {type: disabled}}}}
    # PAID, re-enable later:
    # - {provider: openai, model: gpt-5.6-luna, extra: {reasoning_effort: high}}

  # NO TARGET on purpose: a random free model is not a second opinion. With judge2 empty the
  # pipeline skips it, so a run is single-judge and there is NO DISSENT SIGNAL until a real
  # second model is configured. Re-enable once the xAI key exists:
  judge2: []
    # - {provider: xai, model: grok-4.6}

  # PoC text is not measured by recall, so a fallback is harmless here; the pinned model leads
  # because zai was 429-storming and lost 6 PoCs to it on 2026-09-20.
  poc:
    - {provider: openrouter, model: cohere/north-mini-code:free, extra: {extra_body: {reasoning: {enabled: false}}}}
    - {provider: zai, model: glm-4.7-flash, extra: {extra_body: {thinking: {type: disabled}}}}

  scorer:
    - {provider: openrouter, model: z-ai/glm-5.3-flash}
    - {provider: zai, model: glm-4.7-flash, extra: {extra_body: {thinking: {type: disabled}}}}

# $ per million tokens: [input, output]. Approximate — verify before trusting cost reports.
prices:
  cohere/north-mini-code:free: [0, 0]
  glm-4.7-flash: [0, 0]
  z-ai/glm-4.7-flash: [0.061, 0.400]
  z-ai/glm-5.3-flash: [0.09, 0.30]
  # PAID, re-enable with the targets above:
  # gpt-5.6-luna: [0.20, 1.20]
  # grok-4.6: [2.0, 6.0]

budget:
  monthly_usd: 20
  reserve_usd: 0.5
