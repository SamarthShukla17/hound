# Model IDs, free tiers, and prices change often — verify each one on its provider's
# page before relying on it. This file is a starting point, not a guarantee.
# Last checked 2026-09-16.

providers:
  ollama:
    # Measured on a 16 GB M5 Air: Metal only exposes ~11.8 GiB, and weights + KV
    # cache + macOS itself all have to fit in that. ~5 GB of weights is the
    # practical ceiling (qwen2.5-coder:7b) — a 14B-class model spills partially
    # to CPU and drops ~300x in throughput (0.09 tok/s vs 28 tok/s measured).
    # Local mode is the NDA fallback and judge2, not the daily driver.
    base_url: http://localhost:11434/v1
    local: true
    key_env: null
    rpm: 6000
    concurrency: 4
    timeout: 300

  zai:
    base_url: https://api.z.ai/api/paas/v4
    key_env: ZAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    rpm: 20
    concurrency: 4
    timeout: 120

  openai:
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  xai:
    base_url: https://api.x.ai/v1
    key_env: XAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  anthropic:
    base_url: https://api.anthropic.com/v1/
    key_env: ANTHROPIC_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  x402gw:
    type: x402
    base_url: https://PLACEHOLDER.x402-gateway.example/v1  # TODO: real gateway base_url, testnet first
    key_env: null  # x402 pays with a wallet key (X402_SVM_KEY / X402_EVM_KEY), not a bearer token
    rpm: 30
    concurrency: 2
    timeout: 120

roles:
  # Free/local first: try the free zai tier, then Ollama, then OpenRouter's free pool
  # (which routes to a random underlying model, so it's a last resort, not a first choice).
  mapper:
    - {provider: zai, model: glm-4.7-flash}
    - {provider: ollama, model: qwen2.5-coder:7b}
    - {provider: openrouter, model: openrouter/free}

  hunter:
    - {provider: zai, model: glm-4.7-flash}
    - {provider: ollama, model: qwen2.5-coder:7b}
    - {provider: openrouter, model: openrouter/free}

  # Cheapest strong model first.
  judge:
    - {provider: openrouter, model: z-ai/glm-5.3-flash}
    - {provider: openai, model: gpt-5.6-luna, extra: {reasoning_effort: high}}
    - {provider: zai, model: glm-5.3-flash}
    - {provider: anthropic, model: claude-sonnet-5}

  # A different model family than judge, for an independent second opinion.
  judge2:
    - {provider: xai, model: grok-4.6}
    - {provider: ollama, model: qwen2.5-coder:7b}

  poc:
    - {provider: zai, model: glm-4.7-flash}
    - {provider: ollama, model: qwen2.5-coder:7b}

  scorer:
    - {provider: openrouter, model: z-ai/glm-5.3-flash}
    - {provider: zai, model: glm-4.7-flash}
    - {provider: ollama, model: qwen2.5-coder:7b}

# $ per million tokens: [input, output]. Approximate — verify before trusting cost reports.
prices:
  qwen2.5-coder:7b: [0, 0]
  openrouter/free: [0, 0]
  glm-4.7-flash: [0, 0]
  z-ai/glm-5.3-flash: [0.05, 0.17]
  glm-5.3-flash: [0.05, 0.17]  # same underlying model as z-ai/glm-5.3-flash, routed via zai directly
  gpt-5.6-luna: [0.20, 1.20]
  grok-4.6: [2.0, 6.0]
  claude-sonnet-5: [3.0, 15.0]

budget:
  monthly_usd: 20
  reserve_usd: 0.5
