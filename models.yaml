# Model IDs, free tiers, and prices change often — verify each one on its provider's
# page before relying on it. This file is a starting point, not a guarantee.
# Last checked 2026-09-16.

# hound is cloud-only. Local mode (Ollama) was removed after measuring 0.09 tok/s for a
# 14B-class model and 28 tok/s for 7B on a 16 GB M5 Air — Metal only exposes ~11.8 GiB there,
# and a 7B model is too weak to hunt or judge usefully anyway. --local-only now fails fast
# with that explanation instead of silently routing to a model that can't do the job.

providers:
  zai:
    base_url: https://api.z.ai/api/paas/v4
    key_env: ZAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    rpm: 20
    concurrency: 4
    timeout: 120

  openai:
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  xai:
    base_url: https://api.x.ai/v1
    key_env: XAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  anthropic:
    base_url: https://api.anthropic.com/v1/
    key_env: ANTHROPIC_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  x402gw:
    type: x402
    base_url: https://PLACEHOLDER.x402-gateway.example/v1  # TODO: real gateway base_url, testnet first
    key_env: null  # x402 pays with a wallet key (X402_SVM_KEY / X402_EVM_KEY), not a bearer token
    rpm: 30
    concurrency: 2
    timeout: 120

roles:
  # Free first: the free zai tier, then OpenRouter's free pool as a last resort
  # (it routes to a random underlying model, so it's never a first choice).
  mapper:
    - {provider: zai, model: glm-4.7-flash}
    - {provider: openrouter, model: openrouter/free}

  hunter:
    - {provider: zai, model: glm-4.7-flash}
    - {provider: openrouter, model: openrouter/free}

  # Cheapest strong model first.
  judge:
    - {provider: openrouter, model: z-ai/glm-5.3-flash}
    - {provider: openai, model: gpt-5.6-luna, extra: {reasoning_effort: high}}

  # A different model family than judge, for an independent second opinion. Only
  # runs on candidates that already survived judge, so the call count is small.
  judge2:
    - {provider: xai, model: grok-4.6}

  poc:
    - {provider: zai, model: glm-4.7-flash}
    - {provider: openrouter, model: openrouter/free}

  scorer:
    - {provider: openrouter, model: z-ai/glm-5.3-flash}
    - {provider: zai, model: glm-4.7-flash}

# $ per million tokens: [input, output]. Approximate — verify before trusting cost reports.
prices:
  openrouter/free: [0, 0]
  glm-4.7-flash: [0, 0]
  z-ai/glm-5.3-flash: [0.05, 0.17]
  gpt-5.6-luna: [0.20, 1.20]
  grok-4.6: [2.0, 6.0]

budget:
  monthly_usd: 20
  reserve_usd: 0.5
