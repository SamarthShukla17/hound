# MOSTLY FREE. mapper/hunter/poc run on free models (zai glm-4.7-flash, then the pinned
# cohere/north-mini-code:free).
# judge and scorer run on ONE paid model — openrouter z-ai/glm-5.3-flash (~$0.05/$0.17 per M
# tokens; OpenRouter credit, a few dollars covers many scans) — with free zai glm-4.7-flash as
# fallback. No random model router is used anywhere: every model is pinned by name, so runs
# with the same seed are replicates. A judge/scorer must be a fixed, capable model. The other paid
# targets (gpt-5.6-luna, grok-4.6) stay commented out below. Rate limits are the main
# constraint on the free roles: Z.ai free is ~1 req/sec with a daily cap and 429s under load;
# OpenRouter free is ~20 req/min with a low daily cap.
#
# Model IDs, free tiers, and prices change often — verify each one on its provider's
# page before relying on it. This file is a starting point, not a guarantee.
# Last checked 2026-09-16.

# hound is cloud-only. Local mode (Ollama) was removed after measuring 0.09 tok/s for a
# 14B-class model and 28 tok/s for 7B on a 16 GB M5 Air — Metal only exposes ~11.8 GiB there,
# and a 7B model is too weak to hunt or judge usefully anyway. --local-only now fails fast
# with that explanation instead of silently routing to a model that can't do the job.

providers:
  zai:
    base_url: https://api.z.ai/api/paas/v4
    key_env: ZAI_API_KEY
    rpm: 50
    concurrency: 1
    timeout: 120

  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    rpm: 18
    concurrency: 2
    timeout: 120

  openai:
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  xai:
    base_url: https://api.x.ai/v1
    key_env: XAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  anthropic:
    base_url: https://api.anthropic.com/v1/
    key_env: ANTHROPIC_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  x402gw:
    type: x402
    base_url: https://PLACEHOLDER.x402-gateway.example/v1  # TODO: real gateway base_url, testnet first
    key_env: null  # x402 pays with a wallet key (X402_SVM_KEY / X402_EVM_KEY), not a bearer token
    rpm: 30
    concurrency: 2
    timeout: 120

# Completion-token budget per role. Reasoning models (glm-4.7-flash, glm-5.3-flash) burn
# this on hidden thinking before emitting any content, so it is large; an empty reply with
# usage at the cap logs "TRUNCATED BY max_tokens" naming the role to raise. These are also
# the code defaults (llm.DEFAULT_MAX_TOKENS); a target may override with its own max_tokens.
max_tokens:
  mapper: 8000
  hunter: 20000
  judge: 24000
  judge2: 24000
  poc: 8000
  scorer: 24000

# Reasoning is switched off where the provider supports it, via `extra` (passed straight to
# the SDK call):
#   openrouter: extra_body.reasoning.enabled=false            (confirmed working)
#   zai:        extra_body.thinking.type=disabled             (confirmed working 2026-09-20: a one-word ping
#                                                              dropped from 166 completion tokens to 2)
roles:
  # FREE HUNT-SIDE MODELS ARE PINNED BY NAME. "openrouter/free" was removed on 2026-09-20: it
  # routes to a RANDOM free model, so seeds are not replicates (one bench seed hunted 10 of 15
  # calls on unknown models, another 12 of 14 on zai — the runs were not comparable).
  # cohere/north-mini-code:free chosen from the 21 :free ids listed that day: code-specialised,
  # 256k context, answered 3/3 with gate-passable path:line citations, ~2s with reasoning off.
  # Rejected: qwen/qwen3.8-27b:free and z-ai/glm-5.2:free (both 429 rate-limited upstream when
  # probed), nvidia/nemotron-3-nano-omni-...:free (works, 3-13s, slower).
  # SINGLE TARGET, NO FALLBACK, on purpose. The map feeds every hunter prompt and the hunters
  # produce the candidates recall is measured on, so a mid-run fallback would silently mix
  # models and make seeds non-replicates (measured 2026-09-20: one seed hunted 10/15 calls on
  # unknown models, another 12/14 on zai; the two runs were not comparable). With no fallback a
  # provider failure instead yields an EMPTY lens, which the scan logs loudly — a recall hole
  # that is visible beats a silent model swap. zai glm-4.7-flash was demoted after it timed out
  # on a real bench lens (147s, 0 findings) while 429-storming.
  # PINNED-GLM-HUNTER (2026-09-20). cohere/north-mini-code:free was measured as the sole
  # hunter across 3 seeds and collapsed: 4, 7 and 0 raw candidates (one seed produced NOTHING
  # from all 14 lenses, no errors), 2.2% union recall vs the ~22% baseline. glm-4.7-flash
  # previously produced 34-46 raw. It 429s and is slow, but a lens that fails loudly is
  # recoverable and a model that finds nothing is not.
  mapper:
    - {provider: zai, model: glm-4.7-flash, extra: {extra_body: {thinking: {type: disabled}}}}

  hunter:
    - {provider: zai, model: glm-4.7-flash, extra: {extra_body: {thinking: {type: disabled}}}}

  # Temperature is already 0 for judge calls (see agents.judge). PAID primary, free fallback.
  # z-ai/glm-5.3-flash has MANDATORY reasoning (a reasoning-off extra 400s: "Reasoning is
  # mandatory for this endpoint"), so no extra here — its thinking counts against max_tokens.
  judge:
    - {provider: openrouter, model: z-ai/glm-5.3-flash}
    - {provider: zai, model: glm-4.7-flash, extra: {extra_body: {thinking: {type: disabled}}}}
    # PAID, re-enable later:
    # - {provider: openai, model: gpt-5.6-luna, extra: {reasoning_effort: high}}

  # NO TARGET on purpose: a random free model is not a second opinion. With judge2 empty the
  # pipeline skips it, so a run is single-judge and there is NO DISSENT SIGNAL until a real
  # second model is configured. Re-enable once the xAI key exists:
  judge2: []
    # - {provider: xai, model: grok-4.6}

  # PoC text is not measured by recall, so a fallback is harmless here; the pinned model leads
  # because zai was 429-storming and lost 6 PoCs to it on 2026-09-20.
  poc:
    - {provider: openrouter, model: cohere/north-mini-code:free, extra: {extra_body: {reasoning: {enabled: false}}}}
    - {provider: zai, model: glm-4.7-flash, extra: {extra_body: {thinking: {type: disabled}}}}

  scorer:
    - {provider: openrouter, model: z-ai/glm-5.3-flash}
    - {provider: zai, model: glm-4.7-flash, extra: {extra_body: {thinking: {type: disabled}}}}

# $ per million tokens: [input, output]. Approximate — verify before trusting cost reports.
prices:
  cohere/north-mini-code:free: [0, 0]
  glm-4.7-flash: [0, 0]
  z-ai/glm-5.3-flash: [0.05, 0.17]
  # PAID, re-enable with the targets above:
  # gpt-5.6-luna: [0.20, 1.20]
  # grok-4.6: [2.0, 6.0]

budget:
  monthly_usd: 20
  reserve_usd: 0.5
