# FREE TIER ONLY. Every role below points at a free model; no paid target is active.
# The paid targets (z-ai/glm-5.3-flash, gpt-5.6-luna, grok-4.6) are commented out further
# down, ready to re-enable once the first SecondSwap score says whether a stronger judge
# is worth paying for. Rate limits, not cost, are the constraint now: Z.ai free is roughly
# 1 req/sec with a daily cap; OpenRouter free is ~20 req/min with a low daily cap.
#
# Model IDs, free tiers, and prices change often — verify each one on its provider's
# page before relying on it. This file is a starting point, not a guarantee.
# Last checked 2026-09-16.

# hound is cloud-only. Local mode (Ollama) was removed after measuring 0.09 tok/s for a
# 14B-class model and 28 tok/s for 7B on a 16 GB M5 Air — Metal only exposes ~11.8 GiB there,
# and a 7B model is too weak to hunt or judge usefully anyway. --local-only now fails fast
# with that explanation instead of silently routing to a model that can't do the job.

providers:
  zai:
    base_url: https://api.z.ai/api/paas/v4
    key_env: ZAI_API_KEY
    rpm: 50
    concurrency: 1
    timeout: 120

  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    rpm: 18
    concurrency: 2
    timeout: 120

  openai:
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  xai:
    base_url: https://api.x.ai/v1
    key_env: XAI_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  anthropic:
    base_url: https://api.anthropic.com/v1/
    key_env: ANTHROPIC_API_KEY
    rpm: 60
    concurrency: 4
    timeout: 120

  x402gw:
    type: x402
    base_url: https://PLACEHOLDER.x402-gateway.example/v1  # TODO: real gateway base_url, testnet first
    key_env: null  # x402 pays with a wallet key (X402_SVM_KEY / X402_EVM_KEY), not a bearer token
    rpm: 30
    concurrency: 2
    timeout: 120

roles:
  # openrouter/free routes to a random free model, so it's only ever a fallback (or judge2,
  # where a different provider from the judge is the point).
  mapper:
    - {provider: zai, model: glm-4.7-flash}
    - {provider: openrouter, model: openrouter/free}

  hunter:
    - {provider: zai, model: glm-4.7-flash}
    - {provider: openrouter, model: openrouter/free}

  # Temperature is already 0 for judge calls (see agents.judge).
  judge:
    - {provider: zai, model: glm-4.7-flash}
    - {provider: openrouter, model: openrouter/free}
    # PAID, re-enable later:
    # - {provider: openrouter, model: z-ai/glm-5.3-flash}
    # - {provider: openai, model: gpt-5.6-luna, extra: {reasoning_effort: high}}

  # A different provider than the judge's primary, for an independent second opinion.
  judge2:
    - {provider: openrouter, model: openrouter/free}
    # PAID, re-enable later:
    # - {provider: xai, model: grok-4.6}

  poc:
    - {provider: zai, model: glm-4.7-flash}

  scorer:
    - {provider: zai, model: glm-4.7-flash}
    # PAID, re-enable later:
    # - {provider: openrouter, model: z-ai/glm-5.3-flash}

# $ per million tokens: [input, output]. Approximate — verify before trusting cost reports.
prices:
  openrouter/free: [0, 0]
  glm-4.7-flash: [0, 0]
  # PAID, re-enable with the targets above:
  # z-ai/glm-5.3-flash: [0.05, 0.17]
  # gpt-5.6-luna: [0.20, 1.20]
  # grok-4.6: [2.0, 6.0]

budget:
  monthly_usd: 20
  reserve_usd: 0.5
